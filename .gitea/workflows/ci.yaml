# Gitea PR-CI for the Urinest app.
# Package publication is intentionally not handled here.

name: CI

on:
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-app:
    name: Validate app
    runs-on: ubuntu-latest
    container: public.ecr.aws/docker/library/node:24-bookworm
    env:
      GITEA_NPM_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure private npm auth
        uses: https://git.oranje.wtf/martien/baseline/actions/setup-npm-auth@v2.2.1
        with:
          npm-token: ${{ secrets.NPM_REGISTRY_TOKEN }}
          registry: https://git.oranje.wtf/api/packages/martien/npm/
          scopes: "@oranje,@xenia,@beslismodel"
          preflight-package: "@beslismodel%2fcore"

      - name: Setup Node + install dependencies
        uses: https://git.oranje.wtf/martien/baseline/actions/setup-node@v2.2.1
        with:
          node-version: "24"
          cache-key-prefix: node24-bookworm

      - name: Commitlint
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ] || [ -z "$head" ]; then
            echo "::warning::Geen base/head SHA — sla commitlint over"
            exit 0
          fi
          git fetch --depth 1 origin "$base" 2>/dev/null || git fetch origin "$base"
          npx --no-install commitlint --from "$base" --to "$head" --verbose

      - name: App quality gates
        run: npm run check:app

      - name: Framework package checks
        run: npm run check:framework

      - name: Registry package install smoke
        run: npm run check:package-registry-smoke:current

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Browser regression smoke
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run check:browser-smoke

      - name: Security — package release config
        run: npm run check:package-release-config
        env:
          BESLISMODEL_STRICT_NPMRC: "true"

      - name: Security — npm audit
        run: npm audit --omit=dev --audit-level=high

      - name: Security — no source secrets
        run: |
          if grep -rn --include="*.ts" --include="*.vue" --include="*.js" -P '(?<![a-zA-Z_])eyJ[A-Za-z0-9_-]{10,}' src/ packages/ fixtures/; then
            echo "::error::Possible hardcoded JWT/key found in source code"
            exit 1
          fi

      - name: Security — env files not tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env file is tracked by git"
            exit 1
          fi
