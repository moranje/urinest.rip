name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci:
    name: CI (Node 24)
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@moranje"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}

      - name: Build flow data
        run: npm run build:flows

      - name: Lint + Type-check + Tests (parallel)
        run: |
          npm run format:check &
          PID_FORMAT=$!
          npm run lint &
          PID_LINT=$!
          npm run lint:eslint &
          PID_ESLINT=$!
          npm run check &
          PID_CHECK=$!
          npm run check:tsgo &
          PID_TSGO=$!
          npm run test &
          PID_TEST=$!

          FAIL=0
          wait $PID_FORMAT || FAIL=1
          wait $PID_LINT   || FAIL=1
          wait $PID_ESLINT || FAIL=1
          wait $PID_CHECK  || FAIL=1
          wait $PID_TSGO   || FAIL=1
          wait $PID_TEST   || FAIL=1
          exit $FAIL

      - name: Security — npm audit
        run: npm audit --omit=dev --audit-level=high

      - name: Security — no secrets in code
        run: |
          if grep -rn --include="*.ts" --include="*.vue" --include="*.js" -P '(?<![a-zA-Z_])eyJ[A-Za-z0-9_-]{10,}' src/; then
            echo "::error::Possible hardcoded JWT/key found in source code"
            exit 1
          fi

      - name: Security — .env not tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env file is tracked by git!"
            exit 1
          fi

      - name: Storybook build (geen deploy)
        run: npm run build-storybook

      - name: Framework package checks
        run: npm run check:framework

      - name: Production build
        run: npm run build

      - name: Resolve Chrome
        id: chrome
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "::error::Chrome executable not found"
            exit 1
          fi
          echo "path=$CHROME_PATH" >> "$GITHUB_OUTPUT"

      - name: Browser regression smoke
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: npm run check:browser-smoke

      - name: Lighthouse CI
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: npm run check:lighthouse:only

      - name: Clinical guideline traceability
        run: npm run check:guidelines

      - name: Bundle budget
        run: npm run budget

  deploy:
    name: Release & Deploy
    needs: ci
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@moranje"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}

      - name: Version bump & changelog
        id: release
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            MEANINGFUL=$(git log "${LAST_TAG}..HEAD" --format="%s" --no-merges | grep -cvE "^chore\(release\)" || true)
          else
            MEANINGFUL=$(git log --format="%s" --no-merges | grep -cvE "^chore\(release\)" || true)
          fi

          if [ "$MEANINGFUL" -eq 0 ] 2>/dev/null; then
            echo "No meaningful commits — skipping version bump"
            echo "released=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          npm install --no-save conventional-recommended-bump conventional-changelog-cli conventional-changelog-angular

          BUMP=$(npx conventional-recommended-bump -p angular)
          NEW_VERSION=$(npm version "$BUMP" --no-git-tag-version)

          npx conventional-changelog -p angular -r 1 > /tmp/changelog.md
          npx conventional-changelog -p angular -i CHANGELOG.md -s

          git config user.name "GitHub CI"
          git config user.email "ci@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): ${NEW_VERSION}"
          git tag -a "${NEW_VERSION}" -m "Release ${NEW_VERSION}"

          echo "released=true" >> $GITHUB_OUTPUT
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Bundle budget
        run: npm run budget

      - name: Upload source maps
        run: |
          echo "Uploading source maps to Supabase Storage..."
          if [ -z "${SUPABASE_SERVICE_KEY:-}" ]; then
            echo "::warning::SUPABASE_SERVICE_KEY is missing; skipping source map upload"
            exit 0
          fi
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::warning::SUPABASE_URL is missing; skipping source map upload"
            exit 0
          fi
          RELEASE_VERSION="${{ steps.release.outputs.version }}"
          if [ -z "$RELEASE_VERSION" ]; then
            RELEASE_VERSION="${GITHUB_SHA}"
          fi
          UPLOADED=0
          for f in $(find dist -name '*.map' 2>/dev/null); do
            NAME=$(basename "$f")
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              "${SUPABASE_URL}/storage/v1/object/sourcemaps/urinest.rip/${RELEASE_VERSION}/${NAME}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
              -H "Content-Type: application/json" \
              -H "x-upsert: true" \
              --data-binary @"$f")
            if [ "$STATUS" = "200" ]; then
              echo "  ✓ urinest.rip/${RELEASE_VERSION}/${NAME}"
              UPLOADED=$((UPLOADED + 1))
            else
              echo "  ✗ urinest.rip/${NAME} (HTTP $STATUS)"
              exit 1
            fi
          done
          echo "Done: ${UPLOADED} source map(s) uploaded"
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Remove source maps from deploy artifact
        run: |
          find dist -name '*.map' -delete
          if find dist -name '*.map' | grep -q .; then
            echo "::error::Source maps still present in deploy artifact"
            exit 1
          fi

      - name: Deploy to Netlify
        run: |
          npx --yes netlify-cli@26.1.0 deploy \
            --dir=dist \
            --prod \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --message "Deploy ${{ steps.release.outputs.version || github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 2

      - name: Push release
        if: steps.release.outputs.released == 'true'
        run: |
          echo "Pushing ${{ steps.release.outputs.version }}..."
          git push origin HEAD --follow-tags

      - name: Create GitHub Release
        if: steps.release.outputs.released == 'true'
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "$VERSION" --notes-file /tmp/changelog.md
          else
            gh release create "$VERSION" --title "$VERSION" --notes-file /tmp/changelog.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
